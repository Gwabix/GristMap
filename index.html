<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carte des projets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <div id="sidebar">
        <div id="sidebar-header">Filtres</div>
        <div id="sidebar-content">
            <div class="filter-section">
                <h4>Domaines</h4>
                <div class="filter-list" id="filter-primary"></div>
            </div>
            <div class="filter-section">
                <h4>Niveaux</h4>
                <div class="filter-list" id="filter-secondary"></div>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <div id="no-config">
        <strong>Configuration requise</strong>
        <span>Veuillez configurer les colonnes dans le panneau du widget Grist (Nom, Latitude, Longitude, Domaines,
            Niveaux).</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="script.js"></script>
</body>

</html>
